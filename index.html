
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gantt PRO</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt/dist/frappe-gantt.css">
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt/dist/frappe-gantt.umd.js"></script>

<style>
body { font-family: Arial; margin: 30px; }
</style>
</head>

<body>

<h1>🚀 Sistema Gantt PRO</h1>

<div id="gantt"></div>

<script>
const tasks = [
  {
    id: "1",
    name: "Inicio obra",
    start: "2026-04-01",
    end: "2026-04-05",
    progress: 30
  },
  {
    id: "2",
    name: "Cimentación",
    start: "2026-04-06",
    end: "2026-04-12",
    progress: 10
  }
];

new Gantt("#gantt", tasks);
</script>

</body>
</html>
